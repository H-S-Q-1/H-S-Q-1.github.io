<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>韩的个人主页</title>
    <style>
        /* 让网页滚动更平滑 */
        html { scroll-behavior: smooth; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        /* 顶部导航栏固定在屏幕最上方 */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 15px 0;
            text-align: center;
            z-index: 1000;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
            transition: color 0.3s;
        }
        .navbar a:hover { color: #4CAF50; } /* 鼠标放上去变绿 */

        /* 每一个区块的样式 */
        section {
            min-height: 100vh; /* 每个区块占满一屏高度 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 头像样式 */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 20px;
            background-color: #555; /* 如果图片加载失败，显示灰色底色 */
        }

        .quote {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
        }

        /* 毛玻璃卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            text-align: center;
            line-height: 1.8;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- 导航栏 (注意 href 里的 # 后面跟着对应区块的 id) -->
    <div class="navbar">
        <a href="#home">首页</a>
        <a href="#projects">我的项目</a>
        <a href="#about">关于我</a>
        <a href="#contact">联系方式</a>
    </div>

    <!-- 首页区块 -->
    <section id="home">
        <!-- 把下面的 src 换成你自己的图片链接，或者删掉这段用纯文字 -->
        <img src="https://i.pinimg.com/736x/8f/c2/33/8fc233e1d8d5c8c6a6e3f4f5f6f7f8f9.jpg" alt="头像" class="avatar">
        <div class="quote">
            every song has a sequel, every dream has a part two<br>
            maybe not today, maybe not tomorrow, but someday.<br>
            don't look back in anger
        </div>
    </section>

    <!-- 我的项目区块 -->
    <section id="projects">
        <div class="glass-card">
            <h2>我的项目</h2>
            <p>这里以后会展示我的 C 语言和 Python 项目！</p>
            <p>目前还在努力学习中...</p>
        </div>
    </section>

    <!-- 关于我区块 -->
    <section id="about">
        <div class="glass-card">
            <h2>关于我</h2>
            <p>大一计算机新生，目标星辰大海。</p>
            <p>正在学习 C 语言、Python、算法与数据结构。</p>
        </div>
    </section>

    <!-- 联系方式区块 -->
    <section id="contact">
        <div class="glass-card">
            <h2>联系方式</h2>
            <p>GitHub: <a href="https://github.com/H-S-Q-1" style="color:#4CAF50;">H-S-Q-1</a></p>
        </div>
    </section>

</body>
</html>

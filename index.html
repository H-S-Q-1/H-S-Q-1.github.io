<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eriamon 的个人主页</title>
    <style>
        /* 这里是在设置网页的样式（CSS） */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 这里换成你喜欢的背景图链接，现在用的是一个海边的网图 */
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 顶部导航栏 */
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.3);
            padding: 15px 0;
            text-align: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        /* 圆形头像 */
        .avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid white;
            object-fit: cover;
            margin-bottom: 20px;
        }

        /* 英文名言 */
        .quote {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 40px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
        }

        /* 毛玻璃效果的卡片 */
        .glass-card {
            background: rgba(255, 255, 255, 0.15); /* 半透明白色 */
            backdrop-filter: blur(10px); /* 毛玻璃模糊效果 */
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 30px;
            max-width: 600px;
            text-align: center;
            line-height: 1.8;
            font-size: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <div class="navbar">
        <a href="#">首页</a>
        <a href="#">我的项目</a>
        <a href="#">关于我</a>
        <a href="#">联系方式</a>
    </div>

    <!-- 头像（你可以换成你自己的图片链接） -->
    <img src="https://i.pinimg.com/736x/8f/c2/33/8fc233e1d8d5c8c6a6e3f4f5f6f7f8f9.jpg" alt="头像" class="avatar">

    <!-- 文字 -->
    <div class="quote">
        every song has a sequel, every dream has a part two<br>
        maybe not today, maybe not tomorrow, but someday.<br>
        don't look back in anger
    </div>

    <!-- 毛玻璃卡片 -->
    <div class="glass-card">
        TO SEE THE WORLD, THINGS DANGEROUS<br>
        TO COME TO TO SEEBEHIND WALLS, TO<br>
        DRAW CLOSER TO FIND EACH OTHER AND<br>
        TO FEEL THAT IS THE PURPOSE OF LIFE
    </div>

</body>
</html>
